[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "chemical-evidence"
version = "0.1.0"
description = "Traceable infrared polymer evidence checks and retrospective acceptance evaluation"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "pandas>=1.5", "pyarrow>=10"]
[tool.setuptools.packages.find]
include = ["chemical_evidence*"]
